<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HullFerries{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #10253f; background: #f3f7fb; }
  .lab { font-size: 13px; background: #fff7c2; padding: 6px 16px; }
  header { background: #0e4d6e; color: #fff; }
  header .in { max-width: 960px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  header a { color: #fff; text-decoration: none; }
  header .logo { font-weight: 800; font-size: 22px; margin-right: auto; letter-spacing: .5px; }
  main { max-width: 960px; margin: 0 auto; padding: 28px 16px 64px; }
  .hero { background: linear-gradient(120deg, #0e4d6e, #1b8bb4); color: #fff; border-radius: 14px; padding: 36px 28px; }
  .hero h1 { margin: 0 0 8px; font-size: 32px; }
  .panel { background: #fff; border-radius: 12px; padding: 22px; margin: 18px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .btn { display: inline-block; background: #f2a541; color: #10253f; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input { width: 100%; max-width: 380px; padding: 9px 10px; font: inherit; border: 1px solid #b9c7d3; border-radius: 6px; }
  dl { display: grid; grid-template-columns: 180px 1fr; gap: 6px 12px; margin: 0; }
  dt { font-weight: 600; color: #4b6075; }
  .err { color: #b3261e; font-weight: 600; }
  footer { max-width: 960px; margin: 0 auto; padding: 0 16px 32px; font-size: 14px; color: #4b6075; }
  footer a { color: #0e4d6e; margin-right: 16px; }
  @media (max-width: 560px) { dl { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="lab">Lab 3 · HullFerries is fictional and deliberately vulnerable · all passenger data is fake</div>
<header><div class="in">
  <a class="logo" href="{{ url_for('hullferries.home') }}">HullFerries</a>
  <a href="{{ url_for('hullferries.my_bookings') }}">My bookings</a>
  {% if session.get('hf_user') %}<a href="{{ url_for('hullferries.logout') }}">Log out</a>
  {% else %}<a href="{{ url_for('hullferries.login') }}">Log in</a>{% endif %}
</div></header>
<main>{% block content %}{% endblock %}</main>
<footer>
  <a href="{{ url_for('hullferries.vdp') }}">Vulnerability disclosure</a>
  <a href="{{ url_for('hullferries.security_txt') }}">security.txt</a>
  <span>&copy; HullFerries (fictional)</span>
</footer>
</body>
</html>
